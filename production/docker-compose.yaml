version: '3.8'
services:
  database-mysql:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=hoidanit
      - MYSQL_ROOT_PASSWORD=123456
    ports:
      - '3307:3306'
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ../hoidanit-backend-nodejs
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database-mysql:
        condition: service_healthy
    environment:
      - DB_PORT=3306
      - DB_HOST=database-mysql
      - URL_REACT=http://localhost
      # - DB_HOST=host.docker.internal
      - DB_DIALECT=mysql
      - DB_DATABASE_NAME=hoidanit
      - DB_USERNAME=root
      - DB_PASSWORD=123456
      - PORT=8080
    ports:
      - 8080:8080
    expose:
      - 8080

  nginx:
    build:
      context: ..
      dockerfile: production/Dockerfile.frontend
    ports:
      - 80:80

